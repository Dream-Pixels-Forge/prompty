name: CI
on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  quality:
    # Pinned: `ubuntu-latest` is mid-migration to Ubuntu 26 and emits a
    # runner notice on every run.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with: { version: 11 }
      - uses: actions/setup-node@v7
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm type-check
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm package
      - name: web-ext lint (firefox, AMO rules)
        run: pnpm dlx web-ext@8 lint --source-dir dist/firefox --warnings-as-errors
      - name: validate manifests (chrome + firefox)
        run: pnpm validate
      - name: check landing-page claims
        run: pnpm check:docs
