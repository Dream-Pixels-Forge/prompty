name: CI
on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 11 }
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm type-check
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm package
      - name: web-ext lint (firefox) + addons-linter (chrome)
        run: |
          pnpm dlx web-ext@8 lint --source-dir dist/firefox --warnings-as-errors
          pnpm dlx addons-linter dist/chrome --no-summary
      - uses: actions/upload-artifact@v4
        with:
          name: prompty-packages
          path: |
            dist/*.zip
            dist/*.xpi
