name: Pages
on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - '.github/workflows/pages-deploy.yml'
  workflow_dispatch:

# One deploy at a time; cancel in-flight runs on a new push to main.
concurrency:
  group: pages
  cancel-in-progress: true

# Pages only needs to read the repo.
permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    steps:
      # Prerequisite (one-time, not automated): the repo owner enables Pages
      # at Settings → Pages → Source = "GitHub Actions" before the first deploy.
      # After that, every push to main redeploys automatically.
      - uses: actions/checkout@v7
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: docs
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
