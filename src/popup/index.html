<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Prompty</title>
    <link rel="stylesheet" href="popup.css" />
    <script type="module" src="popup.js"></script>
  </head>
  <body>
    <main class="palette" aria-label="Prompty command palette">
      <header class="palette__head">
        <span class="palette__scope" id="scope" hidden></span>
        <input
          id="query"
          class="palette__input"
          type="text"
          role="combobox"
          aria-expanded="true"
          aria-controls="results"
          aria-autocomplete="list"
          autocomplete="off"
          spellcheck="false"
          placeholder="Search prompts, snippets, commands…"
        />
        <kbd class="palette__kbd" title="Reset palette">Ctrl K</kbd>
      </header>

      <ul id="results" class="palette__list" role="listbox" aria-label="Results"></ul>

      <form id="vars" class="vars" hidden>
        <p class="vars__title" id="vars-title"></p>
        <div id="vars-fields" class="vars__fields"></div>
        <p class="vars__label">Preview</p>
        <p id="vars-preview" class="vars__preview"></p>
      </form>

      <p id="status" class="palette__status" role="status" aria-live="polite"></p>

      <footer class="palette__foot" id="hints">
        <span><kbd>↵</kbd> insert</span>
        <span><kbd>⇧↵</kbd> append</span>
        <span><kbd>Ctrl↵</kbd> copy</span>
        <span><kbd>Alt↵</kbd> save snippet</span>
        <span><kbd>Esc</kbd> back</span>
      </footer>
    </main>
  </body>
</html>
