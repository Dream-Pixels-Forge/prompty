<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="16" height="16">
  <!--
    Prompty toolbar glyph (16/32 px). A simplified mascot drawn on whole pixels:
    dark tile (edge on light toolbars), white monitor (edge on dark toolbars),
    two eyes, and the orange click cursor. Source of icon-16.png / icon-32.png
    via `node scripts/icons.mjs`. The full mascot stays at 48/128 px.
  -->
  <rect x="0" y="0" width="16" height="16" rx="3.5" fill="#0e0e10"/>
  <!-- monitor body (whole-pixel edges) -->
  <rect x="1" y="5" width="10" height="8" rx="2" fill="#ffffff"/>
  <!-- screen -->
  <rect x="3" y="7" width="6" height="4" rx="1" fill="#0e0e10"/>
  <!-- eyes: 1×2 px each -->
  <rect x="4" y="8" width="1" height="2" rx="0.5" fill="#ffffff"/>
  <rect x="7" y="8" width="1" height="2" rx="0.5" fill="#ffffff"/>
  <!-- feet -->
  <rect x="3" y="13" width="2" height="1" fill="#ffffff"/>
  <rect x="7" y="13" width="2" height="1" fill="#ffffff"/>
  <!-- orange click cursor in its own corner (clear of the body, so no outline needed) -->
  <path d="M10.8 0.8 L15.4 2.9 L13.4 3.7 L14.8 5.3 L13.9 6.2 L12.5 4.7 L11.6 6.6 Z"
        fill="#ff6a00"/>
</svg>
